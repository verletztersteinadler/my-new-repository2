# kotly.pro — устранение дублей http/www в поисковом индексе.
# Все варианты хоста отдают 200 и дублируются в индексе; этот конфиг
# собирает их в один канонический https://kotly.pro/.

# HTTP всегда уходит на HTTPS без исключений.
server {
    listen 80;
    listen [::]:80;
    server_name kotly.pro www.kotly.pro;
    return 301 https://kotly.pro$request_uri;
}

# www уходит на основной хост с сохранением пути.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kotly.pro;
    ssl_certificate     /etc/letsencrypt/live/kotly.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotly.pro/privkey.pem;
    return 301 https://kotly.pro$request_uri;
}

# Основной хост: HSTS закрепляет HTTPS в браузерах.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kotly.pro;
    ssl_certificate     /etc/letsencrypt/live/kotly.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotly.pro/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Статика каталога лежит здесь; остальные location без изменений.
    root /var/www/kotly-pro;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
