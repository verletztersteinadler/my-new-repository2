name: Build REG.RU static website ZIP

on:
  push:
    branches:
      - deploy/reg-ru-static
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOTLY_STATIC_EXPORT: "1"
      VITE_STATIC_EXPORT: "1"
    steps:
      - name: Checkout static deployment branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate manufacturer catalog
        run: npm run check:catalog

      - name: Test engineering conversions
        run: npm run test:units

      - name: Test boiler-house sizing and catalog matching
        run: node --experimental-strip-types --test src/lib/boiler-house.test.ts

      - name: Validate pump register and SI pump calculations
        run: node --experimental-strip-types --test src/lib/pump-engineering.test.ts

      - name: Audit critical catalog regression cases
        run: node --experimental-strip-types --test scripts/audit-regression.test.mjs

      - name: Verify short manufacturer routes and permanent redirects
        run: node --test scripts/manufacturer-short-urls.test.mjs

      - name: Test all engineering calculators and IAPWS-IF97 against technical specification
        run: node --experimental-strip-types --test src/lib/calculators.test.ts src/lib/calculators-secondary.test.ts

      - name: Build static website
        run: npm run build:static

      - name: Validate generated routes and TypeScript
        run: npm run typecheck

      - name: Check PHP syntax and fail-closed API status
        shell: bash
        run: |
          php -l dist-reg-ru/api/v1/leads/index.php
          php -S 127.0.0.1:18765 -t dist-reg-ru > /tmp/kotly-php-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          target = "http://127.0.0.1:18765/api/v1/leads/index.php"
          for i in range(25):
              try:
                  with urllib.request.urlopen(target, timeout=2) as r:
                      response=json.load(r)
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise AssertionError("PHP endpoint not running")
          assert response.get("enabled") is False, response
          request = urllib.request.Request(target,
              data=b'{}',
              headers={"Content-Type":"application/json","Origin":"https://kotly.pro"},
              method="POST")
          try:
              urllib.request.urlopen(request, timeout=2)
              raise AssertionError("Unconfigured PHP backend accepted a lead")
          except urllib.error.HTTPError as e:
              assert e.code == 503, e.code
          print("PHP endpoint disabled until private legal/operator configuration is complete")
          PY
          mkdir -m 700 kotly-pro-private
          cat > kotly-pro-private/config.php <<'PHP'
          <?php
          return [
            'enabled' => true,
            'privacy_approved' => true,
            'operator_name' => 'Test Operator (CI only)',
            'operator_postal_address' => 'Test postal address (CI only)',
            'operator_contact' => 'privacy@example.org',
            'recipient' => 'test@example.org',
            'sender' => 'no-reply@kotly.pro',
            'notify_by_email' => false,
            'policy_version' => 'kotly-consent-draft-2026-11-23',
            'rate_secret' => '0123456789abcdef0123456789abcdef0123456789abcdef',
          ];
          PHP
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.error, uuid
          target="http://127.0.0.1:18765/api/v1/leads/index.php"
          with urllib.request.urlopen(target, timeout=3) as r:
              assert json.load(r).get("enabled") is True
          payload={
              "submission_id":str(uuid.uuid4()),
              "name":"Тестовая заявка",
              "phone":"+7 999 123 45 67",
              "email":"tester@example.org",
              "comment":"Паровая котельная: 1 т/ч",
              "consent":True,
              "consent_version":"kotly-consent-draft-2026-11-23",
              "page_url":"https://kotly.pro/kotelnaya/?email=must-not-be-stored",
              "website":"",
          }
          def submit(extra=None, origin="https://kotly.pro"):
              body=json.dumps({**payload,**(extra or {})},ensure_ascii=False).encode("utf-8")
              request=urllib.request.Request(target, data=body, method="POST",
                headers={"Origin":origin,"Content-Type":"application/json","Accept":"application/json"})
              with urllib.request.urlopen(request, timeout=4) as res:
                  return res.status,json.load(res)
          code,first=submit()
          assert code==201 and first["lead_id"].startswith("KP-"),first
          code,replay=submit()
          assert code==200 and replay["lead_id"]==first["lead_id"] and replay["replay"] is True
          try:
              submit({"consent":False})
              raise AssertionError("Missing consent incorrectly accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code==422
          try:
              submit(origin="https://outside.example")
              raise AssertionError("Cross-origin request accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code==403
          files=list(pathlib.Path("kotly-pro-private").glob("leads-*.jsonl"))
          assert len(files)==1,files
          rows=[json.loads(line) for line in files[0].read_text(encoding="utf-8").splitlines()]
          assert len(rows)==1,rows
          assert rows[0]["name"]=="Тестовая заявка"
          assert rows[0]["page_path"]=="/kotelnaya/"
          assert "must-not-be-stored" not in files[0].read_text(encoding="utf-8")
          print("Verified PHP lead reception, private storage, idempotency, consent, origin protection")
          PY
          rm -rf kotly-pro-private

      - name: Verify static output and create upload ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          root = Path("dist-reg-ru")
          index = root / "index.html"
          htaccess = root / ".htaccess"
          assert index.is_file() and index.stat().st_size > 250, "No static index.html"
          assert htaccess.is_file(), "No routing .htaccess"
          php = root / "api" / "v1" / "leads" / "index.php"
          assert php.is_file(), "Missing PHP lead endpoint"
          assert "kotly-pro-private" in php.read_text(encoding="utf-8"), "Missing private lead storage config"
          assert not (root / "kotly-pro-private").exists(), "Private lead data included in public ZIP"
          boiler_house_page = root / "kotelnaya" / "index.html"
          assert boiler_house_page.is_file(), "Missing prerendered /kotelnaya page"
          assert "конфигурацию котельной" in boiler_house_page.read_text(encoding="utf-8").lower(), "Boiler-house page content not prerendered"
          calc_index = root / "calculators" / "index.html"
          assert calc_index.is_file(), "Missing prerendered calculator directory"
          calc_html = calc_index.read_text(encoding="utf-8")
          assert "инженерные калькуляторы онлайн" in calc_html.lower(), "SEO landing heading not prerendered"
          assert "52 бесплатных инженерных калькулятора" in calc_html.lower(), "Keyword-relevant landing content missing"
          assert "https://kotly.pro/calculators/" in calc_html, "Canonical calculator page URL missing"
          assert "index, follow" in calc_html.lower(), "Search robots directive missing"
          assert "noindex" not in calc_html.lower(), "SEO landing marked noindex"
          assert "расчёт мощности котла" in calc_html.lower(), "Popular search intent omitted from landing"
          core = Path("src/lib/calculators.ts").read_text(encoding="utf-8")
          extra = Path("src/lib/calculators-secondary-definitions.ts").read_text(encoding="utf-8")
          original_tools = re.findall(r'\{id:"([a-z0-9-]+)",group:', core)
          second_wave = re.findall(r'define\("([a-z0-9-]+)",', extra)
          tool_paths = original_tools + second_wave
          assert len(tool_paths) == 52 and len(set(tool_paths)) == 52, f"Expected 52 unique tools, got {len(tool_paths)}"
          for name in tool_paths:
              page = root / "calculators" / name / "index.html"
              assert page.is_file(), f"Missing prerendered /calculators/{name}"
              data_text = page.read_text(encoding="utf-8").lower()
              assert "инженерные калькуляторы" in data_text or "исходные данные" in data_text, f"Unrendered calculator page: {name}"
          for name in ["water-power", "steam-capacity", "pipe-loss"]:
              detail_html = (root / "calculators" / name / "index.html").read_text(encoding="utf-8")
              assert "https://kotly.pro/calculators/" + name + "/" in detail_html, f"Noncanonical tool page {name}"
              assert "формула" in detail_html.lower(), f"Missing visible formula context for {name}"
          print("Verified", len(tool_paths), "indexable calculator pages with canonical SEO and natural search content")
          conf = root / "configurators" / "index.html"
          assert conf.is_file(), "Missing configurator hub"
          for name in ["water","steam","oil","modular"]:
              page = root / "configurators" / name / "index.html"
              assert page.is_file(), f"Missing configured /configurators/{name}"
              data_text = page.read_text(encoding="utf-8").lower()
              assert "кот" in data_text or "термомасл" in data_text, f"Missing configurator content: {name}"
          sitemap = root / "sitemap.xml"
          assert sitemap.is_file(), "No sitemap.xml"
          xml = sitemap.read_text(encoding="utf-8")
          assert xml.count("<url>") >= 300, "Incomplete sitemap"
          assert "<loc>https://kotly.pro/calculators/steam-properties/</loc>" in xml, "Missing steam calculator canonical"
          assert "<loc>https://kotly.pro/calculators/</loc>" in xml, "Generic engineering calculator hub missing from sitemap"
          assert sum("<loc>https://kotly.pro/calculators/" in item for item in xml.split("<url>")) >= 53, "Some of the 52 calculator pages are missing from sitemap"
          assert "<loc>https://kotly.pro/configurators/oil/</loc>" in xml, "Missing thermal-oil configurator canonical"
          assert "https://kotly.pro/nasosy/" not in xml, "Noindex pump register must not enter sitemap"
          robots = root / "robots.txt"
          assert robots.is_file() and "Sitemap: https://kotly.pro/sitemap.xml" in robots.read_text(encoding="utf-8")
          print("Verified four configurators, canonical sitemap, robots.txt")
          pumps_page = root / "nasosy" / "index.html"
          assert pumps_page.is_file(), "Missing prerendered /nasosy page"
          assert "промышленные насосы для котельных" in pumps_page.read_text(encoding="utf-8").lower(), "Pump page content missing"
          data = index.read_text(encoding="utf-8")
          assert "<html" in data.lower() and "</html>" in data.lower(), "Invalid SPA shell"
          files = [p for p in root.rglob("*") if p.is_file()]
          assert any(p.suffix == ".js" for p in files), "No browser JS"
          assert any(p.suffix == ".css" for p in files), "No browser CSS"
          assert not any(p.name in {"package.json", "package-lock.json"} for p in files), "Server files accidentally included"
          out = Path("kotly-pro-reg-ru-static.zip")
          with ZipFile(out, "w", ZIP_DEFLATED, compresslevel=6) as z:
              for p in files:
                  z.write(p, p.relative_to(root).as_posix())
          print("Verified SPA shell, CSS/JS assets and rewrite rules.")
          print("Packaged", len(files), "static files into", out, "size", out.stat().st_size)
          print("Archive root:", ", ".join(sorted(p.name for p in root.iterdir())[:15]))
          PY

      - name: Upload ISPmanager package
        uses: actions/upload-artifact@v4
        with:
          name: kotly-pro-reg-ru-static
          path: kotly-pro-reg-ru-static.zip
          if-no-files-found: error
          retention-days: 30
