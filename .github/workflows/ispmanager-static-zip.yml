name: Package static kotly.pro for ISPmanager

on:
  push:
    branches:
      - work/catalog-completion-2026-11-20
    paths:
      - .github/workflows/ispmanager-static-zip.yml
      - src/**
      - public/**
      - vite.config.ts
      - package.json
      - package-lock.json
      - scripts/generate-seo-files.mjs
      - scripts/check-no-external-links.mjs
      - scripts/image-audit.mjs
      - scripts/series-name-audit.mjs
      - scripts/series-names.test.mjs
      - scripts/catalog-brand-search.test.mjs
      - scripts/release-copy-check.mjs
      - server/php/**
      - server/deploy/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Test image audit validation rules
        run: node --test scripts/image-audit.test.mjs
      - name: Test production-safe series copy
        run: node --experimental-strip-types --test scripts/public-series-text.test.mjs
      - name: Verify Russian and Latin manufacturer search
        run: node --test scripts/catalog-brand-search.test.mjs
      - name: Verify consistent catalog naming
        run: npm run test:series-names && npm run audit:series-names
      - name: Upload full series naming audit
        uses: actions/upload-artifact@v4
        with:
          name: kotly-pro-series-name-audit
          path: reports/catalog/
          retention-days: 30
      - name: Gate images and generate provenance report
        run: npm run check:images && npm run audit:images
      - name: Upload image audit report
        uses: actions/upload-artifact@v4
        with:
          name: kotly-pro-image-audit
          path: reports/images/
          retention-days: 30
      - name: Install PHP runtime for server-side email handler
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl
          tools: composer:v2
          coverage: none
      - name: Validate and install secure SMTP mailer
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish --working-dir=server/php
          composer install --working-dir=server/php --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php -l server/php/leads.php
          php -l server/php/notify.php
          php -l server/php/retry.php
          php -l server/php/smtp-diagnose.php
          bash -n server/deploy/setup-mail.sh
          bash -n server/deploy/install.sh
      - name: Build static prerendered site and regenerate route typings
        env:
          KOTLY_STATIC_EXPORT: '1'
        run: npm run build:dev
      - name: Verify TypeScript with regenerated routes
        run: npm run typecheck
      - name: Test strict analog compatibility
        run: node --experimental-strip-types --test src/lib/analog-engine.test.ts src/lib/boiler-house.test.ts
      - name: Inspect public export
        shell: bash
        run: |
          set -euo pipefail
          pwd
          find .vercel/output/static -maxdepth 2 -type d | head -25 || true
          find .vercel/output/static -maxdepth 4 -name "*.html" | head -25 || true
          find . -maxdepth 3 -name "index.html" | head -25 || true
          test -f .vercel/output/static/index.html
          echo "Prerendered HTML count:"
          find .vercel/output/static -name '*.html' | tee /tmp/kotly-html-pages.txt | wc -l
          test "$(wc -l </tmp/kotly-html-pages.txt)" -gt 5
          echo "Output size:"
          du -sh .vercel/output/static
      - name: Generate and verify SEO sitemap and robots.txt
        run: node scripts/generate-seo-files.mjs .vercel/output/static
      - name: Block internal editorial notes in published pages
        run: node scripts/release-copy-check.mjs .vercel/output/static
      - name: Audit generated pages for external outbound links
        run: node scripts/check-no-external-links.mjs .vercel/output/static
      - name: Copy PHP endpoint into static publication directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel/output/static/api/v1/_server
          cp server/php/leads.php .vercel/output/static/api/v1/leads.php
          cp server/php/notify.php server/php/retry.php .vercel/output/static/api/v1/_server/
          cp -r server/php/vendor .vercel/output/static/api/v1/_server/vendor
          cat > .vercel/output/static/api/v1/_server/.htaccess <<'PRIVATE'
          Require all denied
          PRIVATE
          test -f .vercel/output/static/api/v1/_server/vendor/autoload.php
      - name: Smoke-test PHP endpoint without sending mail
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18971 -t .vercel/output/static > /tmp/kotly-php-local.log 2>&1 &
          TEST_PID=$!
          trap 'kill "$TEST_PID" 2>/dev/null || true' EXIT
          sleep 1
          URL=http://127.0.0.1:18971/api/v1/leads.php
          GET_STATUS="$(curl --silent --output /tmp/kotly-get.json --write-out '%{http_code}' "$URL")"
          test "$GET_STATUS" = 405
          BAD_STATUS="$(curl --silent --output /tmp/kotly-bad.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"","phone":"","consent":false}' "$URL")"
          test "$BAD_STATUS" = 422
          echo "PHP endpoint: GET 405, invalid POST 422; no SMTP credentials or message sent"
      - name: Prepare Apache/ISPmanager package
        shell: bash
        run: |
          set -euo pipefail
          cat > .vercel/output/static/.htaccess <<'APACHE'
          Options -MultiViews
          DirectoryIndex index.html
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule ^api/v1/_server/ - [F,L]
          RewriteRule ^api/v1/leads/?$ api/v1/leads.php [END]
          RewriteRule ^manufacturers/([^/]+)/?$ /$1 [R=301,L,NE]
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^(.+?)/?$ $1/index.html [L]
          </IfModule>
          <IfModule mod_headers.c>
          Header always set X-Content-Type-Options "nosniff"
          Header always set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>
          APACHE
          printf 'kotly.pro static export from commit %s\n' "$GITHUB_SHA" > .vercel/output/static/BUILD-INFO.txt
          cd .vercel/output/static
          zip -q -r "$GITHUB_WORKSPACE/kotly-pro-ISPmanager-2026-11-24.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -tq kotly-pro-ISPmanager-2026-11-24.zip
          unzip -Z1 kotly-pro-ISPmanager-2026-11-24.zip | grep -q 'api/v1/leads.php'
          unzip -Z1 kotly-pro-ISPmanager-2026-11-24.zip | grep -q 'api/v1/_server/vendor/autoload.php'
          if unzip -Z1 kotly-pro-ISPmanager-2026-11-24.zip | grep -q 'mail-config.php'; then
            echo 'ERROR: private mail credentials accidentally packed'
            exit 1
          fi
      - name: Build secret-free complete deployment kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/kotly-publish-kit"
          mkdir -p "$KIT"
          cp kotly-pro-ISPmanager-2026-11-24.zip "$KIT/site.zip"
          cp server/deploy/install.sh server/deploy/setup-mail.sh server/deploy/INSTALL.md "$KIT/"
          cp server/php/smtp-diagnose.php server/php/mail-config.example.php "$KIT/"
          cd "$KIT"
          zip -q -r "$GITHUB_WORKSPACE/kotly-pro-PUBLISH-READY-2026-11-24.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -tq kotly-pro-PUBLISH-READY-2026-11-24.zip
          test "$(unzip -Z1 kotly-pro-PUBLISH-READY-2026-11-24.zip | grep -Fc mail-config.example.php)" -eq 1
          if unzip -Z1 kotly-pro-PUBLISH-READY-2026-11-24.zip | grep -Fx mail-config.php; then
            echo 'ERROR: private credential file included'
            exit 1
          fi
      - name: Upload complete deployment kit
        uses: actions/upload-artifact@v4
        with:
          name: kotly-pro-PUBLISH-READY-2026-11-24
          path: kotly-pro-PUBLISH-READY-2026-11-24.zip
          retention-days: 30
      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotly-pro-ISPmanager-2026-11-24
          path: kotly-pro-ISPmanager-2026-11-24.zip
          retention-days: 30
      - name: Show ZIP artifact publication details
        shell: bash
        run: |
          echo "Validated ZIP is uploaded as the GitHub Actions artifact named kotly-pro-ISPmanager-2026-11-24."
          echo "Release publishing is intentionally disabled: repository GitHub Actions token lacks Releases write permissions (HTTP 403)."
